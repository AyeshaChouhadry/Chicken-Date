<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Chicken Tender Date</title>
</head>
<body>
    <!-- Screen one : Flash Screen -->
    <section id="splash" class="screen active">
        <div id="starter-heading">
         <h1>Chicken Tender Date Permission 🌭</h1>
         <p id="splash-para">(MUHEHEHEHE! You are the Chosen one 😈)</p>
        </div>
    </section>  

    <!-- Screen two : The Question -->
    <section id="question" class="screen">
       <div id="question-heading">
          <div id="hello-heading">
             <h1 id="question-title">Hello Zamhini! </h1>
          </div>
          <p id="question-para">Will you bring me some tenders today ? 🔪</p>
          <div id="button-container">
             <button id = "yes-button">Yes</button>
             <button id = "no-button">No</button>
          </div>
       </div>
    </section>

    <!-- Screen three : The success -->
    <section id="success" class="screen">
        <h1 id="party-time">Yay! partyyyyy Timeeee !</h1>
        <p id="dance-text">💁🏼Bitch Dance 💃 </p>
        <img id="dance-gif" src="dance.gif" alt="Happy dancing" width="250">
    </section>
    <script src="app.js"></script>
</body>
</html>
